name: Bash checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and offline tests
        run: bash -n vpn-manager && bash -n tests/test.sh && bash tests/test.sh
